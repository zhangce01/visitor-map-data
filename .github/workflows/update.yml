name: Update visitor map

on:
  schedule:
    - cron: "23 9 * * *"   # once a day, 09:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency: update-visitor-map

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read the counters
        run: python3 aggregate.py

      - name: Commit what changed
        run: |
          git add visitors.json slots.json
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update visitor map"
          git push
